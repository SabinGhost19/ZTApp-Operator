apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zta-operator-role
rules:
  - apiGroups: [ "apiextensions.k8s.io" ]
    resources: [ "customresourcedefinitions" ]
    verbs: [ "get", "list", "watch" ]
  - apiGroups: [ "devsecops.licenta.ro" ]
    resources: [ "zerotrustapplications", "zerotrustapplications/status" ]
    verbs: [ "get", "list", "watch", "patch", "update" ]
  - apiGroups: [ "devsecops.licenta.ro" ]
    resources: [ "zerotrustsecrets", "zerotrustsecrets/status" ]
    verbs: [ "get", "list", "watch", "patch", "update" ]
  - apiGroups: [ "devsecops.licenta.ro" ]
    resources: [ "supplychainattestations" ]
    verbs: [ "get", "list", "watch", "patch", "update" ]
  - apiGroups: [ "external-secrets.io" ]
    resources: [ "externalsecrets" ]
    verbs: [ "create", "get", "list", "watch", "update", "patch", "delete" ]
  - apiGroups: [ "apps" ]
    resources: [ "deployments" ]
    verbs: [ "create", "get", "list", "watch", "update", "patch", "delete" ]
  - apiGroups: [ "apps" ]
    resources: [ "statefulsets", "daemonsets" ]
    verbs: [ "get", "list", "watch", "update", "patch" ]
  - apiGroups: [ "" ]
    resources: [ "services", "configmaps", "events", "secrets" ]
    verbs: [ "create", "get", "list", "watch", "update", "patch", "delete" ]
  # events.k8s.io/v1 is a distinct API group from legacy core/v1 events.
  # The operator emits via client.EventsV1Api (supply_chain_attestation.py:
  # _emit_event) which targets the new group. Without this rule every call
  # silently fails with "audit-event-emit-failed" and the UI's
  # EventsTimelinePanel only shows kopf success/failure rollups instead of
  # the per-step verification events (CosignVerified, SbomAttestation*, ...).
  - apiGroups: [ "events.k8s.io" ]
    resources: [ "events" ]
    verbs: [ "create", "get", "list", "watch", "patch" ]
  - apiGroups: [ "security.istio.io" ]
    resources: [ "authorizationpolicies" ]
    verbs: [ "create", "get", "list", "watch", "update", "patch", "delete" ]
  - apiGroups: [ "extensions.istio.io" ]
    resources: [ "wasmplugins" ]
    verbs: [ "create", "get", "list", "watch", "update", "patch", "delete" ]
  - apiGroups: [ "networking.k8s.io" ]
    resources: [ "networkpolicies" ]
    verbs: [ "create", "get", "list", "watch", "update", "patch", "delete" ]
  - apiGroups: [ "networking.k8s.io" ]
    resources: [ "ingresses" ]
    verbs: [ "create", "get", "list", "watch", "update", "patch", "delete" ]
