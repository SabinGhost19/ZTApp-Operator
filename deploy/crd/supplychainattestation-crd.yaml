apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: supplychainattestations.devsecops.licenta.ro
spec:
  group: devsecops.licenta.ro
  names:
    kind: SupplyChainAttestation
    plural: supplychainattestations
    singular: supplychainattestation
    shortNames:
      - sca
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                sourceValidation:
                  type: object
                  properties:
                    enforceCosign:
                      type: boolean
                      default: true
                    trustedIssuers:
                      type: array
                      items:
                        type: string
                provenance:
                  type: object
                  properties:
                    requireVoucher:
                      type: boolean
                      default: false
                    enforceHmacChain:
                      type: boolean
                      default: true
                    minSlsaLevel:
                      type: integer
                      minimum: 0
                      default: 0
                    trustedRepositories:
                      type: array
                      items:
                        type: string
                vulnerabilityPolicy:
                  type: object
                  properties:
                    maxAllowedSeverity:
                      type: string
                      enum: [Low, Medium, High, Critical]
                    failOnFixable:
                      type: boolean
                      default: false
                sbomPolicy:
                  type: object
                  properties:
                    enforceSBOM:
                      type: boolean
                      default: true
                    forbiddenPackages:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          maxVersion:
                            type: string
                policyBinding:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    requireAttestationType:
                      type: string
                      default: https://devsecops.licenta.ro/attestations/custom-zta-policy/v1
                strictManifestHash:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    enforcementAction:
                      type: string
                      enum: [Reject, Alert]
                      default: Reject
                slsaProvenancePolicy:
                  type: object
                  description: |
                    Enforcement of signed SLSA v1.0 provenance attestations
                    (predicate type https://slsa.dev/provenance/v1).
                  properties:
                    enforceSlsa:
                      type: boolean
                      default: false
                    requiredLevel:
                      type: integer
                      default: 0
                    # trustedIssuers used by cosign --certificate-identity
                    # when verifying the SLSA attestation signature. SLSA
                    # is signed by the slsa-github-generator reusable
                    # workflow, NOT by the calling workflow — so it needs
                    # its own issuer list distinct from
                    # sourceValidation.trustedIssuers.
                    trustedIssuers:
                      type: array
                      items:
                        type: string
                    # trustedBuilders / allowedBuildTypes are predicate-level
                    # checks (matched against predicate.runDetails.builder.id
                    # and predicate.buildDefinition.buildType). Independent
                    # of the signing identity above.
                    trustedBuilders:
                      type: array
                      items:
                        type: string
                    allowedBuildTypes:
                      type: array
                      items:
                        type: string
                openVexPolicy:
                  type: object
                  description: |
                    Enforcement of signed OpenVEX v0.2.0 attestations as a
                    first-class artifact (independent of the Trivy-exemption
                    code path).
                  properties:
                    enforceOpenVex:
                      type: boolean
                      default: false
                    requireStatements:
                      type: boolean
                      default: false
                customRules:
                  type: array
                  description: |
                    Dynamic policy rules evaluated by CEL (Common Expression Language).
                    Each expression is evaluated with context:
                      {voucher, image, zta, vex, sbom}
                    Example: "voucher.build_context.slsa_level >= 3 && image.startsWith('ghcr.io/')"
                  items:
                    type: object
                    required: [name, expression, action]
                    properties:
                      name:
                        type: string
                      description:
                        type: string
                      expression:
                        type: string
                      action:
                        type: string
                        enum: [Allow, Deny, Alert]
                runtimeEnforcement:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    onPolicyDrift:
                      type: string
                      enum: [Isolate, Kill, Alert]
                      default: Isolate
                    onVulnerabilityFound:
                      type: string
                      enum: [Kill, Alert]
                      default: Alert
      additionalPrinterColumns:
        - name: DriftAction
          type: string
          jsonPath: .spec.runtimeEnforcement.onPolicyDrift
