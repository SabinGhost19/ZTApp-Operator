[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zta-operator"
version = "0.1.0"
description = "ZeroTrustApplication Kubernetes Operator"
requires-python = ">=3.11"
dependencies = [
  "kopf==1.37.4",
  "kubernetes==30.1.0",
  "PyYAML==6.0.2",
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "cryptography>=43.0.0",
  "cel-python==0.1.5",
  "httpx==0.27.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
