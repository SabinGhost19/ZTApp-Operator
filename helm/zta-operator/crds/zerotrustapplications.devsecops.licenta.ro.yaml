apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: zerotrustapplications.devsecops.licenta.ro
spec:
  group: devsecops.licenta.ro
  names:
    kind: ZeroTrustApplication
    plural: zerotrustapplications
    singular: zerotrustapplication
    shortNames:
      - zta
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                replicas:
                  type: integer
                  minimum: 1
                  default: 1
                securityPolicyRef:
                  type: object
                  required: [ name ]
                  properties:
                    name:
                      type: string
                networkZeroTrust:
                  type: object
                  properties:
                    ingressAllowedFrom:
                      type: array
                      items:
                        type: object
                        properties:
                          namespace:
                            type: string
                    egressAllowedTo:
                      type: array
                      items:
                        type: object
                        properties:
                          namespace:
                            type: string
                          ports:
                            type: array
                            items:
                              type: integer
                wafConfig:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum: [ Monitor, Block ]
                      default: Block
                    appProfile:
                      type: string
                      default: REST-API
                runtimeSecurity:
                  type: object
                  properties:
                    allowedPaths:
                      type: array
                      items:
                        type: string
                    onCompromise:
                      type: string
                      enum: [ Isolate, Kill ]
                      default: Isolate
                ingress:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    host:
                      type: string
                    className:
                      type: string
                      default: nginx
                    path:
                      type: string
                      default: /
                    pathType:
                      type: string
                      default: Prefix
                    servicePort:
                      type: integer
                      default: 80
                    authUrl:
                      type: string
                    authSignin:
                      type: string
                    authResponseHeaders:
                      type: string
                    oauth2Enabled:
                      type: boolean
                      default: true
                    oauth2ServiceName:
                      type: string
                      default: oauth2-proxy
                    oauth2ServiceNamespace:
                      type: string
                      default: oauth2-proxy
                    oauth2ServicePort:
                      type: integer
                      default: 80
                    oauth2IngressPath:
                      type: string
                      default: /oauth2
                    groupsHeader:
                      type: string
                      default: X-Forwarded-Groups
                    groupsHeaderFallback:
                      type: string
                      default: X-Auth-Request-Groups
            status:
              type: object
              properties:
                phase:
                  type: string
                lastError:
                  type: string
                trustLevel:
                  type: string
                  enum: [ Untrusted, Verified, UntrustedProvenance ]
                securityState:
                  type: string
                lastVerified:
                  type: string
                activeViolations:
                  type: array
                  items:
                    type: string
                provenance:
                  x-kubernetes-preserve-unknown-fields: true
                attestations:
                  x-kubernetes-preserve-unknown-fields: true
                details:
                  x-kubernetes-preserve-unknown-fields: true
                # Async telemetry sub-status: the main `phase` flips to
                # Running as soon as the Deployment is created, while
                # guacIngestionStatus tracks the slow OCI->GUAC pull on
                # a background worker thread. Lets the UI render a
                # green pod card AND a small spinner for "intel pending".
                guacIngestionStatus:
                  type: string
                  enum: [ "", InProgress, Completed, Failed, Disabled ]
                guacIngestionMessage:
                  type: string
                guacIngestionCompletedAt:
                  type: string
                # SHA256 of the desired spec written by the operator after a
                # successful reconcile. Used as an idempotency watermark to
                # short-circuit reconcile re-triggers for the same spec
                # (kopf field watchers can re-fire spuriously when two
                # operators patch the same CR concurrently).
                specReconcileHash:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Trust
          type: string
          jsonPath: .status.trustLevel
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: GUAC
          type: string
          jsonPath: .status.guacIngestionStatus
