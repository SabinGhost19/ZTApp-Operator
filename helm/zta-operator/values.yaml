nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/sabinghost19/zta-operator
  tag: sha-15088f8
  pullPolicy: IfNotPresent

replicaCount: 1

serviceAccount:
  create: true
  name: zta-operator

operator:
  logLevel: INFO
  watchAllNamespaces: true
  talonNamespace: falco-talon
  talonConfigMapName: falco-talon-rules
  talonConfigMapKey: rules.yaml
  # GUAC ingestion endpoints (official guacsec/guac Helm chart conventions).
  # Set graphqlUrl to "" to disable GUAC integration entirely; the operator
  # then skips the async worker and PATCHes status.guacIngestionStatus=Disabled.
  guac:
    graphqlUrl: http://graphql-server.guac.svc.cluster.local:8080/query
    # gRPC endpoint that drives oci-collector. Leave empty to disable SBOM/VEX
    # discovery (deployment edges still land via graphqlUrl).
    collectsubUrl: collectsub.guac.svc.cluster.local:2782
    # Stock GUAC has no REST collector — leave empty to skip the push path.
    # Set this only if you front GUAC with a custom HTTP shim that accepts
    # {format, document} payloads.
    collectorUrl: ""
  ingress:
    className: nginx
    path: /
    pathType: Prefix
    authUrl: http://oauth2-proxy.oauth2-proxy.svc.cluster.local/oauth2/auth
    authSigninTemplate: https://{host}/oauth2/start?rd=$escaped_request_uri
    authResponseHeaders: X-Auth-Request-User, X-Auth-Request-Email, X-Auth-Request-Groups
    groupsHeader: X-Forwarded-Groups
    groupsHeaderFallback: X-Auth-Request-Groups
    oauth2ServiceName: oauth2-proxy
    oauth2ServiceNamespace: oauth2-proxy
    oauth2ServicePort: 80
    oauth2IngressPath: /oauth2

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

rbac:
  create: true

falcoTalonRbac:
  enabled: false
  namespace: falco-talon
  configMapName: falco-talon-rules

crd:
  install: true
